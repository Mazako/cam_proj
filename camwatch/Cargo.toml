[workspace]
members = ["crates/camwatch"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
backon = "1.6"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
opencv = { version = "0.100", default-features = false, features = ["imgcodecs", "imgproc", "video"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0"
tempfile = "3.15"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.15", features = ["v7"] }
