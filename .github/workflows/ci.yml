name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install GStreamer and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libopencv-dev \
            clang \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

      - name: Run full R2 integration test
        if: github.event_name == 'workflow_dispatch'
        env:
          CAMWATCH_R2_ENDPOINT: ${{ secrets.CAMWATCH_R2_ENDPOINT }}
          CAMWATCH_R2_ACCESS_KEY_ID: ${{ secrets.CAMWATCH_R2_ACCESS_KEY_ID }}
          CAMWATCH_R2_SECRET_ACCESS_KEY: ${{ secrets.CAMWATCH_R2_SECRET_ACCESS_KEY }}
          CAMWATCH_R2_BUCKET: ${{ secrets.CAMWATCH_R2_BUCKET }}
          CAMWATCH_R2_PREFIX: ci/
          CAMWATCH_R2_REGION: auto
        run: >-
          cargo test --test integration_test
          records_assembles_and_uploads_a_clip_to_r2
          -- --ignored --test-threads=1

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check diff
        run: git diff --check
