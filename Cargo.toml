[workspace]
members = ["crates/camwatch", "crates/camwatch-server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8"
backon = "1.6"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.2.1"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
opencv = { version = "0.100", default-features = false, features = ["imgcodecs", "imgproc", "video"] }
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0"
tempfile = "3.15"
time = "0.3"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower-sessions = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.15", features = ["v7"] }
